<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styling.css">
    <title>Time Tracker</title>

    <body>
        <main class="container">
            <div class="Profile_card">
                <div class="profile-top">
                    <div class="Profile_image">
                        <img src="Speedmaster.jpeg" alt="Jeremy Nyanchiri" class="Profile_image">
                    </div>
                    <p>Report for</p>
                    <h1>Jeremy<br>Nyanchiri</h1>
                </div>
                <div class="profile-bottom">
                    <p>Daily</p>
                    <p>Weekly</p>
                    <p>Monthly</p>
                </div>
            </div>

            <section class="Criteria">
            <div class="Work_card">
                <div class="card-content">
                    <div class="card-header">
                        <h2>Work</h2>
                        <button class="Menu">...</button>
                    </div>
                    <h2>32hrs</h2>
                    <p>Last week: 36hrs</p>
                </div>
            </div>
            <div class="Play_card">
                <div class="card-content">
                    <div class="card-header">
                        <h2>Play</h2>
                        <button class="Menu">...</button>
                    </div>
                    <h2>10hrs</h2>
                    <p>Last week: 8hrs</p>
                </div>
            </div>
            <div class="Study_card">
                <div class="card-content">
                    <div class="card-header">
                        <h2>Study</h2>
                        <button class="Menu">...</button>
                    </div>
                    <h2>4hrs</h2>
                    <p>Last week: 7hrs</p>
                </div>
            </div>
            <div class="Exercise_card">
                <div class="card-content">
                    <div class="card-header">
                        <h2>Exercise</h2>
                        <button class="Menu">...</button>
                    </div>
                    <h2>4hrs</h2>
                    <p>Last week: 5hrs</p>
                </div>
            </div>
            <div class="Social_card">
                <div class="card-content">
                    <div class="card-header">
                        <h2>Social</h2>
                        <button class="Menu">...</button>
                    </div>
                    <h2>5hrs</h2>
                    <p>Last week: 10hrs</p>
                </div>
            </div>
            <div class="Self_care_card">
                <div class="card-content">
                    <div class="card-header">
                        <h2>Self Care</h2>
                        <button class="Menu">...</button>
                    </div>
                    <h2>2hrs</h2>
                    <p>Last week: 2hrs</p>
                </div>
            </div>
            </section>
        </main>
    </body>
</html>
